<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horarios Basket</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1b2430; --muted: #66727f;
    --accent: #0a7d5a; --border: #d8dee4;
    --alba: #c026d3; --diego: #ea580c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a222b; --text: #e8edf2; --muted: #92a0ae;
            --accent: #3ddc9a; --border: #2b3642; --alba: #e879f9; --diego: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         padding: 24px 0; }
  header { padding: 0 16px; margin-bottom: 16px; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0; color: var(--muted); font-size: .9rem; }
  .legend { display: flex; justify-content: center; gap: 16px; margin-top: 10px; font-size: .82rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.alba { background: var(--alba); }
  .dot.diego { background: var(--diego); }

  .toolbar { display: flex; justify-content: center; margin-top: 12px; }
  button#editBtn { font: inherit; font-size: .85rem; font-weight: 600; color: var(--accent);
                   background: transparent; border: 1px solid var(--accent); border-radius: 999px;
                   padding: 6px 16px; cursor: pointer; }
  button#editBtn:active { opacity: .7; }
  .sync-status { margin: 8px 0 0; font-size: .75rem; color: var(--muted); }
  .auth-status { margin: 6px 0 0; font-size: .78rem; color: var(--muted); }
  .auth-status button { font: inherit; font-size: .78rem; color: var(--accent); background: none;
                         border: none; text-decoration: underline; cursor: pointer; padding: 0; }

  .scroller { display: flex; gap: 14px; overflow-x: auto; padding: 8px 16px 20px;
              scroll-snap-type: x mandatory; scroll-padding: 0 16px; }
  .scroller::-webkit-scrollbar { height: 6px; }
  .scroller::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .day { flex: 0 0 85%; max-width: 320px; scroll-snap-align: center;
         background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .day.today { border-color: var(--accent); border-width: 2px; }
  .day h2 { margin: 0 0 14px; font-size: 1.1rem; display: flex; align-items: center; justify-content: space-between; }
  .today-badge { font-size: .7rem; font-weight: 600; color: var(--accent);
                 border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; }

  .session { border-left: 3px solid var(--border); padding: 4px 0 4px 10px; margin-bottom: 10px; }
  .session:last-child { margin-bottom: 0; }
  .session.alba { border-color: var(--alba); }
  .session.diego { border-color: var(--diego); }
  .session .row-top { display: flex; align-items: center; justify-content: space-between; }
  .session .who { font-weight: 600; font-size: .9rem; }
  .session .time { font-size: .95rem; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .session .school-link { color: var(--muted); font-size: .8rem; margin-top: 2px; display: inline-block; text-decoration: none; }
  .session .school-link:hover { text-decoration: underline; }
  .rest { color: var(--muted); font-size: .85rem; font-style: italic; }

  /* Los campos solo son interactivos en modo edición; el resto del tiempo se ven como texto plano */
  .field-time, .field-who { font: inherit; color: var(--text); background: transparent;
                            border: 1px solid transparent; border-radius: 6px; padding: 1px 2px;
                            pointer-events: none; }
  .field-who { font-weight: 600; font-size: .9rem; appearance: none; -webkit-appearance: none; }
  body.editing .field-time, body.editing .field-who { border-color: var(--border); background: var(--bg); pointer-events: auto; }

  .field-school { display: none; width: 100%; font: inherit; font-size: .8rem; color: var(--text);
                  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
                  padding: 1px 4px; margin-top: 2px; }
  body.editing .field-school { display: block; }
  body.editing .school-link { display: none; }

  .del-btn { display: none; border: none; background: transparent; color: var(--muted);
             font-size: .9rem; line-height: 1; cursor: pointer; padding: 0 2px; }
  .del-btn:hover { color: #dc2626; }
  body.editing .del-btn { display: inline-block; }

  .add-btn { display: none; width: 100%; margin-top: 4px; padding: 8px; font: inherit; font-size: .82rem;
             font-weight: 600; color: var(--accent); background: transparent; border: 1px dashed var(--accent);
             border-radius: 8px; cursor: pointer; }
  body.editing .add-btn { display: block; }

  .section-title { padding: 0 16px; margin: 28px 0 8px; font-size: 1.05rem; text-align: center; }
  .time .label { color: var(--muted); font-size: .78rem; margin-right: 2px; }
  .home-away { display: inline-block; margin-top: 4px; }
  a.back { display: block; width: fit-content; margin-bottom: 8px; color: var(--muted); font-size: .85rem; text-decoration: none; }
  a.back:hover { color: var(--accent); }
</style>
</head>
<body>
<header>
  <a class="back" href="../">← Índice</a>
  <h1>🏀 Horarios Basket</h1>
  <p class="sub">Entrenamientos semanales de Alba y Diego</p>
  <div class="legend">
    <span><i class="dot alba"></i>Alba</span>
    <span><i class="dot diego"></i>Diego</span>
  </div>
  <div class="toolbar"><button id="editBtn" type="button">🔐 Iniciar sesión para editar</button></div>
  <p class="auth-status" id="authStatus" hidden>Conectado como <span id="authEmail"></span> · <button type="button" id="logoutBtn">Salir</button></p>
  <p class="sync-status" id="syncStatus">☁️ Conectando…</p>
</header>

<div class="scroller" id="scroller"></div>

<h2 class="section-title">🏆 Partidos de fin de semana</h2>
<div class="scroller" id="scrollerPartidos"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const ALLOWED_EDITORS = ['letalfi@gmail.com', 'familiatamayoaragon@gmail.com'];

  const firebaseConfig = {
    apiKey: "AIzaSyBRV-8u1lGReVePvM_yGpkZmwRYFzEvjbg",
    authDomain: "repowebsft.firebaseapp.com",
    projectId: "repowebsft",
    storageBucket: "repowebsft.firebasestorage.app",
    messagingSenderId: "84158890650",
    appId: "1:84158890650:web:0aec1222fd74a317f85523"
  };
  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  const auth = getAuth(firebaseApp);
  const googleProvider = new GoogleAuthProvider();
  const cloudDocRef = doc(db, 'basket', 'main');
  const syncStatus = document.getElementById('syncStatus');
  let applyingRemote = false;
  let currentUser = null;

  function isAuthorized(user) {
    return !!user && ALLOWED_EDITORS.includes(user.email);
  }

  const STORAGE_KEY = 'horarios-basket';
  const STORAGE_KEY_PARTIDOS = 'horarios-basket-partidos';

  const defaultSchedule = [
    { day: 1, name: 'Lunes', sessions: [
      { who: 'diego', start: '17:30', end: '19:00', school: 'Gloria Fuertes' },
      { who: 'alba',  start: '20:00', end: '21:30', school: 'CEIP María Blanchard' },
    ]},
    { day: 2, name: 'Martes', sessions: [
      { who: 'diego', start: '19:00', end: '20:30', school: 'María Blanchard' },
      { who: 'alba',  start: '20:00', end: '21:30', school: 'CEIP María Blanchard' },
    ]},
    { day: 3, name: 'Miércoles', sessions: [
      { who: 'diego', start: '19:00', end: '20:15', school: 'Santa Margarita' },
    ]},
    { day: 4, name: 'Jueves', sessions: [
      { who: 'diego', start: '19:00', end: '20:30', school: 'Santa Margarita' },
    ]},
    { day: 5, name: 'Viernes', sessions: [
      { who: 'diego', start: '18:15', end: '19:30', school: 'Gloria Fuertes' },
      { who: 'alba',  start: '17:00', end: '18:30', school: 'CEIP María Blanchard' },
    ]},
  ];

  function loadSchedule() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* localStorage no disponible o datos corruptos: usar valores por defecto */ }
    return structuredClone(defaultSchedule);
  }

  function saveSchedule() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
    syncToCloud();
  }

  function mapsUrl(place) {
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`;
  }

  const defaultMatches = [
    { day: 6, name: 'Sábado', matches: [
      { who: 'alba', convocatoria: '08:45', place: 'Polideportivo Villanueva del Pardillo', homeAway: 'local' },
    ]},
    { day: 0, name: 'Domingo', matches: [] },
  ];

  function loadMatches() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_PARTIDOS);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* localStorage no disponible o datos corruptos: usar valores por defecto */ }
    return structuredClone(defaultMatches);
  }

  function saveMatches() {
    localStorage.setItem(STORAGE_KEY_PARTIDOS, JSON.stringify(matchSchedule));
    syncToCloud();
  }

  function syncToCloud() {
    if (applyingRemote) return; // evita reenviar los datos que acabamos de recibir de la nube
    setDoc(cloudDocRef, { schedule, matches: matchSchedule, updatedAt: Date.now() })
      .then(() => { syncStatus.textContent = '☁️ Sincronizado'; })
      .catch(() => { syncStatus.textContent = '📴 Sin conexión (guardado solo en este dispositivo)'; });
  }

  let schedule = loadSchedule();
  let matchSchedule = loadMatches();

  function render(centerToday) {
    const scroller = document.getElementById('scroller');
    const prevScroll = scroller.scrollLeft;
    scroller.innerHTML = '';
    for (const day of schedule) {
      const section = document.createElement('section');
      section.className = 'day';
      section.dataset.day = day.day;

      const h2 = document.createElement('h2');
      h2.innerHTML = `${day.name} <span class="today-badge" hidden>Hoy</span>`;
      section.appendChild(h2);

      if (day.sessions.length === 0) {
        const p = document.createElement('p');
        p.className = 'rest';
        p.textContent = 'Alba y Diego descansan';
        section.appendChild(p);
      } else {
        for (const s of day.sessions) {
          const div = document.createElement('div');
          div.className = `session ${s.who}`;
          div.innerHTML = `
            <div class="row-top">
              <select class="field-who who" data-field="who">
                <option value="diego"${s.who === 'diego' ? ' selected' : ''}>Diego</option>
                <option value="alba"${s.who === 'alba' ? ' selected' : ''}>Alba</option>
              </select>
              <button type="button" class="del-btn" title="Eliminar">✕</button>
            </div>
            <div class="time">
              <input class="field-time" type="time" value="${s.start}" data-field="start">
              –
              <input class="field-time" type="time" value="${s.end}" data-field="end">
            </div>
            <a class="school-link" href="${mapsUrl(s.school)}" target="_blank" rel="noopener">📍 ${s.school}</a>
            <input class="field-school" type="text" value="${s.school}" data-field="school" placeholder="Colegio">`;
          div.querySelectorAll('[data-field]').forEach(input => {
            input.addEventListener('change', () => {
              s[input.dataset.field] = input.value;
              if (input.dataset.field === 'who') div.className = `session ${input.value}`;
              if (input.dataset.field === 'school') {
                const link = div.querySelector('.school-link');
                link.href = mapsUrl(input.value);
                link.textContent = `📍 ${input.value}`;
              }
              saveSchedule();
            });
          });
          div.querySelector('.del-btn').addEventListener('click', () => {
            day.sessions.splice(day.sessions.indexOf(s), 1);
            saveSchedule();
            render(false);
          });
          section.appendChild(div);
        }
      }

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'add-btn';
      addBtn.textContent = '+ Añadir entrenamiento';
      addBtn.addEventListener('click', () => {
        day.sessions.push({ who: 'diego', start: '18:00', end: '19:00', school: '' });
        saveSchedule();
        render(false);
      });
      section.appendChild(addBtn);

      scroller.appendChild(section);
    }
    markToday(centerToday, prevScroll);
  }

  function centerOrRestore(scroller, prevScroll, centerToday, matchFn) {
    const days = [...scroller.querySelectorAll('.day')];
    const current = days.find(matchFn);
    if (current) {
      current.classList.add('today');
      current.querySelector('.today-badge').hidden = false;
    }
    if (centerToday && current) {
      requestAnimationFrame(() => {
        const offset = current.offsetLeft - (scroller.clientWidth - current.clientWidth) / 2;
        scroller.scrollTo({ left: offset, behavior: 'instant' });
      });
    } else {
      scroller.scrollLeft = prevScroll;
    }
  }

  function markToday(centerToday, prevScroll) {
    const scroller = document.getElementById('scroller');
    // JS getDay(): 0=domingo ... 6=sábado. Fines de semana se centran en lunes/viernes.
    let today = new Date().getDay();
    if (today === 0) today = 1;
    if (today === 6) today = 5;
    centerOrRestore(scroller, prevScroll, centerToday, d => Number(d.dataset.day) === today);
  }

  function renderMatches(centerToday) {
    const scroller = document.getElementById('scrollerPartidos');
    const prevScroll = scroller.scrollLeft;
    scroller.innerHTML = '';
    for (const day of matchSchedule) {
      const section = document.createElement('section');
      section.className = 'day';
      section.dataset.day = day.day;

      const h2 = document.createElement('h2');
      h2.innerHTML = `${day.name} <span class="today-badge" hidden>Hoy</span>`;
      section.appendChild(h2);

      if (day.matches.length === 0) {
        const p = document.createElement('p');
        p.className = 'rest';
        p.textContent = 'Sin partido programado';
        section.appendChild(p);
      } else {
        for (const m of day.matches) {
          const div = document.createElement('div');
          div.className = `session ${m.who}`;
          div.innerHTML = `
            <div class="row-top">
              <select class="field-who who" data-field="who">
                <option value="diego"${m.who === 'diego' ? ' selected' : ''}>Diego</option>
                <option value="alba"${m.who === 'alba' ? ' selected' : ''}>Alba</option>
              </select>
              <button type="button" class="del-btn" title="Eliminar">✕</button>
            </div>
            <div class="time">
              <span class="label">Convocatoria</span>
              <input class="field-time" type="time" value="${m.convocatoria}" data-field="convocatoria">
            </div>
            <select class="field-who home-away" data-field="homeAway">
              <option value="local"${m.homeAway === 'local' ? ' selected' : ''}>🏠 Local</option>
              <option value="visitante"${m.homeAway === 'visitante' ? ' selected' : ''}>🚌 Visitante</option>
            </select>
            <a class="school-link" href="${mapsUrl(m.place)}" target="_blank" rel="noopener">📍 ${m.place}</a>
            <input class="field-school" type="text" value="${m.place}" data-field="place" placeholder="Lugar">`;
          div.querySelectorAll('[data-field]').forEach(input => {
            input.addEventListener('change', () => {
              m[input.dataset.field] = input.value;
              if (input.dataset.field === 'who') div.className = `session ${input.value}`;
              if (input.dataset.field === 'homeAway' && input.value === 'local') {
                m.place = 'Pabellón Juan de la Cierva, Getafe';
                div.querySelector('.field-school').value = m.place;
              }
              if (input.dataset.field === 'homeAway' && input.value === 'visitante') {
                m.place = '';
                div.querySelector('.field-school').value = m.place;
              }
              if (input.dataset.field === 'place' || input.dataset.field === 'homeAway') {
                const link = div.querySelector('.school-link');
                link.href = mapsUrl(m.place);
                link.textContent = `📍 ${m.place}`;
              }
              saveMatches();
            });
          });
          div.querySelector('.del-btn').addEventListener('click', () => {
            day.matches.splice(day.matches.indexOf(m), 1);
            saveMatches();
            renderMatches(false);
          });
          section.appendChild(div);
        }
      }

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'add-btn';
      addBtn.textContent = '+ Añadir partido';
      addBtn.addEventListener('click', () => {
        day.matches.push({ who: 'diego', convocatoria: '09:00', place: 'Pabellón Juan de la Cierva, Getafe', homeAway: 'local' });
        saveMatches();
        renderMatches(false);
      });
      section.appendChild(addBtn);

      scroller.appendChild(section);
    }
    // JS getDay(): 0=domingo, 6=sábado. Entre semana no se resalta ningún día.
    const today = new Date().getDay();
    centerOrRestore(scroller, prevScroll, centerToday, d => Number(d.dataset.day) === today);
  }

  const editBtn = document.getElementById('editBtn');
  const authStatus = document.getElementById('authStatus');
  const authEmail = document.getElementById('authEmail');

  editBtn.addEventListener('click', async () => {
    if (!isAuthorized(currentUser)) {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        if (!isAuthorized(result.user)) {
          alert('Esta cuenta no tiene permiso para editar los horarios.');
          await signOut(auth);
        }
      } catch (e) { /* el usuario cerró el popup o falló el login: no hacemos nada */ }
      return;
    }
    const editing = document.body.classList.toggle('editing');
    editBtn.textContent = editing ? '✅ Guardar y salir' : '✏️ Editar horarios';
  });

  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    document.body.classList.remove('editing');
    if (isAuthorized(user)) {
      editBtn.textContent = '✏️ Editar horarios';
      authEmail.textContent = user.email;
      authStatus.hidden = false;
    } else {
      editBtn.textContent = '🔐 Iniciar sesión para editar';
      authStatus.hidden = true;
      if (user) signOut(auth); // logueado pero no autorizado
    }
  });

  render(true);
  renderMatches(true);

  onSnapshot(cloudDocRef, (snap) => {
    if (!snap.exists()) {
      syncToCloud();
      syncStatus.textContent = '☁️ Sincronizado';
      return;
    }
    const data = snap.data();
    applyingRemote = true;
    if (data.schedule) { schedule = data.schedule; localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule)); render(false); }
    if (data.matches) { matchSchedule = data.matches; localStorage.setItem(STORAGE_KEY_PARTIDOS, JSON.stringify(matchSchedule)); renderMatches(false); }
    applyingRemote = false;
    syncStatus.textContent = '☁️ Sincronizado';
  }, () => {
    syncStatus.textContent = '📴 Sin conexión (guardado solo en este dispositivo)';
  });
</script>
</body>
</html>
