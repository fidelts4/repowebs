<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repowebs</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1b2430; --muted: #66727f;
    --accent: #0a7d5a; --border: #d8dee4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a222b; --text: #e8edf2; --muted: #92a0ae;
            --accent: #3ddc9a; --border: #2b3642; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         display: flex; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  a.page { display: block; background: var(--card); border: 1px solid var(--border);
           border-radius: 14px; padding: 16px 18px; color: var(--text); text-decoration: none; }
  a.page:hover { border-color: var(--accent); }
  a.page .name { font-weight: 600; }
  a.page .desc { color: var(--muted); font-size: .85rem; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <h1>📄 repowebs</h1>
  <p class="sub">Índice de páginas publicadas en este repositorio.</p>
  <ul>
    <li><a class="page" href="limitador-carga/">
      <div class="name">⚡ Limitador de carga</div>
      <div class="desc">Calcula la energía a indicar en el cargador para llegar al % deseado.</div>
    </a></li>
    <li><a class="page" href="horarios-basket/">
      <div class="name">🏀 Horarios Basket</div>
      <div class="desc">Horario semanal de entrenamientos de Alba y Diego.</div>
    </a></li>
  </ul>
</main>
</body>
</html>
