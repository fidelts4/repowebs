<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limitador de carga EV</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1b2430; --muted: #66727f;
    --accent: #0a7d5a; --border: #d8dee4; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a222b; --text: #e8edf2; --muted: #92a0ae;
            --accent: #3ddc9a; --border: #2b3642; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         display: flex; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 14px; padding: 20px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 4px; }
  label:first-of-type { margin-top: 0; }
  .field { display: flex; align-items: center; gap: 8px; }
  input { width: 100%; padding: 10px 12px; font-size: 1rem; color: var(--text);
          background: transparent; border: 1px solid var(--border); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .unit { color: var(--muted); min-width: 36px; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .result { margin-top: 0; padding: 18px; border-radius: 12px; text-align: center;
            border: 2px solid var(--accent); }
  .result .big { font-size: 2.6rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .result .label { color: var(--muted); font-size: .85rem; }
  .result.msg { border-color: var(--border); }
  .result.msg .big { font-size: 1.1rem; color: var(--warn); }
  .details { margin: 12px 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); font-size: .88rem; color: var(--muted); }
  .details div { display: flex; justify-content: space-between; padding: 3px 0; }
  .details b { color: var(--text); }
  a.back { display: block; width: fit-content; margin-bottom: 12px; color: var(--muted); font-size: .85rem; text-decoration: none; }
  a.back:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Índice</a>
  <h1>⚡ Limitador de carga</h1>
  <p class="sub">Calcula la energía que debes indicar en el cargador para llegar al % deseado.</p>

  <form class="card" id="f" novalidate>
    <label for="current">Porcentaje actual</label>
    <div class="field"><input id="current" type="number" inputmode="decimal" min="0" max="100" step="any" value="20"><span class="unit">%</span></div>

    <div class="result" id="out" aria-live="polite"></div>
    <div class="result" id="outTime" aria-live="polite"></div>
    <div class="details" id="det"></div>

    <label for="target">Carga máxima deseada</label>
    <div class="field"><input id="target" type="number" inputmode="decimal" min="1" max="100" step="any" value="80"><span class="unit">%</span></div>

    <label for="cap">Batería máxima del coche</label>
    <div class="field"><input id="cap" type="number" inputmode="decimal" min="1" step="any" value="18.4"><span class="unit">kWh</span></div>

    <label for="power">Velocidad de carga del cargador</label>
    <div class="field"><input id="power" type="number" inputmode="decimal" min="0.1" step="any" value="2.7"><span class="unit">kW</span></div>
    <div class="hint">Potencia a la que carga (kW = kWh por hora).</div>

    <label for="eff">Eficiencia de carga (opcional)</label>
    <div class="field"><input id="eff" type="number" inputmode="decimal" min="50" max="100" step="any" value="90"><span class="unit">%</span></div>
    <div class="hint">Solo afecta a la energía desde la red. Pon 100 para ignorarlas.</div>

  </form>
</main>

<script>
  const $ = id => document.getElementById(id);
  const fmt = (n, d = 1) => n.toLocaleString('es-ES', { maximumFractionDigits: d, minimumFractionDigits: d });

  function msg(text) {
    $('out').className = 'result msg';
    $('out').innerHTML = `<div class="big">${text}</div>`;
    $('outTime').style.display = 'none';
    $('det').innerHTML = '';
  }

  function calc() {
    const cap = parseFloat($('cap').value), target = parseFloat($('target').value),
          cur = parseFloat($('current').value), power = parseFloat($('power').value),
          eff = parseFloat($('eff').value);

    if ([cap, target, cur, eff].some(isNaN)) return msg('Rellena todos los campos');
    if (cap <= 0 || eff <= 0 || eff > 100) return msg('Revisa los valores introducidos');
    if (target > 100 || target <= 0 || cur < 0 || cur > 100) return msg('Los porcentajes deben estar entre 0 y 100');
    if (cur >= target) return msg('El coche ya está en o por encima del objetivo: no hace falta cargar');

    const stored = cap * (target - cur) / 100;   // energía que debe entrar en la batería
    const used = cap * (100 - cur) / 100;        // energía gastada de la batería (hasta el 100%)
    const fromGrid = stored / (eff / 100);       // energía que debe suministrar el cargador

    const hTotal = power > 0 ? fromGrid / power : null;   // horas necesarias
    let timeTxt = '—';
    if (hTotal !== null) {
      const mins = Math.round(hTotal * 60);
      timeTxt = `${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, '0')} min`;
    }

    $('out').className = 'result';
    $('out').innerHTML = `<div class="label">Limita el cargador a</div>
                          <div class="big">${fmt(stored)} kWh</div>`;
    $('outTime').className = 'result';
    $('outTime').style.display = '';
    $('outTime').innerHTML = `<div class="label">Tiempo de carga${power > 0 ? ' a ' + fmt(power) + ' kW' : ''}</div>
                          <div class="big">${timeTxt}</div>`;
    $('det').innerHTML = `
      <div><span>Energía gastada de la batería</span><b>${fmt(used)} kWh</b></div>
      <div><span>Energía desde la red (con pérdidas del ${fmt(100 - eff, 0)}%)</span><b>${fmt(fromGrid)} kWh</b></div>`;
  }

  $('f').addEventListener('input', calc);
  $('f').addEventListener('submit', e => e.preventDefault());
  calc();
</script>
</body>
</html>
